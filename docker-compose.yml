services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evdb-frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evdb-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: evdb.ckp4koyskic0.us-east-1.rds.amazonaws.com
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: evdb
      DB_PORT: 3306
    restart: unless-stopped
